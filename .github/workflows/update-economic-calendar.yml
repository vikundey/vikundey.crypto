name: Update US Economic Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
    - cron: "15 13 * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch economic calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_calendar.py

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- data/calendar.json; then
            echo "No calendar changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/calendar.json
          git commit -m "Update US economic calendar"
          git push
