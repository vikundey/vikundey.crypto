<script>
  const el = (id) => document.getElementById(id);

  function setAccessBadge(id, enabled) {
    const node = el(id);

    if (enabled) {
      node.textContent = "Доступ";
      node.classList.remove("no");
      node.classList.add("yes");
    } else {
      node.textContent = "Немає";
      node.classList.remove("yes");
      node.classList.add("no");
    }
  }

  function planLabel(plan) {
    if (plan === "full") return "Full Vikundey Space";
    if (plan === "news") return "News Vikundey Space";
    return "Немає активної";
  }

  async function claimInviteIfPresent() {
    const params = new URLSearchParams(window.location.search);

    const claimToken =
      params.get("invite_claim");

    if (!claimToken) {
      return;
    }

    el("loading").textContent =
      "Активуємо твоє запрошення…";

    try {
      const response =
        await fetch(
          "/api/profile/invite/claim",
          {
            method: "POST",
            credentials: "same-origin",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body: JSON.stringify({
              claimToken
            })
          }
        );

      let data = {};

      try {
        data = await response.json();
      } catch {
        data = {};
      }

      if (
        !response.ok ||
        !data.ok
      ) {
        throw new Error(
          data.error ||
          "Не вдалося активувати запрошення."
        );
      }

      // Прибираємо token із URL,
      // щоб він не залишався в адресному рядку.
      window.history.replaceState(
        {},
        document.title,
        "/profile/account/"
      );

      el("loading").textContent =
        "Запрошення активовано. Завантажуємо профіль…";

    } catch (error) {
      console.error(
        "Invite claim failed",
        error
      );

      el("loading").classList.add("hidden");

      el("error").textContent =
        error.message ||
        "Не вдалося активувати запрошення.";

      el("error").style.display =
        "block";

      throw error;
    }
  }

  async function loadProfile() {
    try {
      const response =
        await fetch(
          "/api/profile",
          {
            method: "GET",

            credentials:
              "same-origin",

            headers: {
              "Accept":
                "application/json"
            }
          }
        );

      if (!response.ok) {
        throw new Error(
          "Profile API error"
        );
      }

      const data =
        await response.json();

      if (!data.ok) {
        throw new Error(
          data.error ||
          "Profile error"
        );
      }

      el("email").textContent =
        data.email || "—";

      el("plan").textContent =
        planLabel(data.plan);

      const fullPlanVisual =
        el("fullPlanVisual");

      const newsPlanVisual =
        el("newsPlanVisual");

      fullPlanVisual.classList.toggle(
        "active-plan",
        data.plan === "full"
      );

      newsPlanVisual.classList.toggle(
        "active-plan",
        data.plan === "news"
      );

      const active =
        data.status === "active";

      el("statusText").textContent =
        active
          ? "Активна"
          : "Неактивна";

      el("statusPill").textContent =
        active
          ? "● Active"
          : "● Inactive";

      el("statusPill").classList.toggle(
        "active",
        active
      );

      el("statusPill").classList.toggle(
        "inactive",
        !active
      );

      setAccessBadge(
        "accessNfp",
        !!data.access?.nfp
      );

      setAccessBadge(
        "accessCpi",
        !!data.access?.cpi
      );

      setAccessBadge(
        "accessThoughts",
        !!data.access?.thoughts
      );

      const cta =
        el("cta");

      const button =
        el("subscribeButton");

      if (data.subscriptionUrl) {
        button.href =
          data.subscriptionUrl;
      }

      if (data.plan === "none") {
        cta.style.display =
          "block";

        el("ctaTitle").textContent =
          "Відкрий Vikundey Space";

        el("ctaText").textContent =
          "Обери формат доступу та отримай авторську аналітику, ринковий контекст і матеріали, які допомагають бачити ринок ширше за окремий реліз чи новину.";

        button.textContent =
          "Обрати підписку →";

      } else if (
        data.plan === "news"
      ) {
        cta.style.display =
          "block";

        el("ctaTitle").textContent =
          "Перейти на Full";

        el("ctaText").textContent =
          "У тебе вже є NFP та CPI. Full також відкриває Vikundey Thoughts.";

        button.textContent =
          "Переглянути Full →";

      } else {
        cta.style.display =
          "none";
      }

      el("loading").classList.add(
        "hidden"
      );

      el("profileContent").classList.remove(
        "hidden"
      );

    } catch (error) {
      console.error(
        "Profile load failed",
        error
      );

      el("loading").classList.add(
        "hidden"
      );

      el("error").style.display =
        "block";
    }
  }

  async function initProfile() {
    try {
      await claimInviteIfPresent();

      await loadProfile();

    } catch {
      // Помилка вже показана користувачу.
    }
  }

  initProfile();
</script>
